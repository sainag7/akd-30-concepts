<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board | AKD 30.0</title>
<meta name="description" content="The committees behind AKD 30.0.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.page-head { padding: clamp(60px, 9vw, 110px) 0 clamp(30px, 5vw, 60px); text-align: center; }
.page-head h1 { font-size: clamp(64px, 11vw, 150px); }
.page-head p { max-width: 52ch; margin: 18px auto 0; font-size: 19px; }

/* Photo album: sepia prints held in place by black corner mounts */
.album { display: grid; grid-template-columns: repeat(4, 1fr); gap: 50px 34px; padding: 20px 0 clamp(80px, 10vw, 130px); }
.print { position: relative; margin: 0; padding: 10px 10px 0; background: #F8F1E1; box-shadow: 0 10px 24px rgba(74, 35, 18, .22); transform: rotate(var(--tilt)); transition: transform .3s; }
.print:hover, .print:focus-within { transform: rotate(0deg) scale(1.03); z-index: 2; }
.print .ph { aspect-ratio: 4 / 5; overflow: hidden; }
.print img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; filter: sepia(.85) contrast(1.05) brightness(.95); transition: filter .4s; }
.print:hover img, .print:focus-within img { filter: none; }
.print figcaption { padding: 10px 2px 14px; text-align: center; font-size: 18px; }
.print i { position: absolute; width: 30px; height: 30px; background: #2B160B; }
.print i:nth-of-type(1) { left: -6px; top: -6px; clip-path: polygon(0 0, 100% 0, 0 100%); }
.print i:nth-of-type(2) { right: -6px; top: -6px; clip-path: polygon(0 0, 100% 0, 100% 100%); }
.print i:nth-of-type(3) { left: -6px; bottom: -6px; clip-path: polygon(0 0, 100% 100%, 0 100%); }
.print i:nth-of-type(4) { right: -6px; bottom: -6px; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
.note { text-align: center; color: var(--sepia); font-size: 15px; margin: -40px 0 60px; }
@media (max-width: 900px) { .album { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 600px) { .album { grid-template-columns: 1fr 1fr; gap: 34px 20px; } .print figcaption { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) { .print { transition: none; } }
</style>
</head>
<body>

<header class="nav" data-page="board"></header>

<main>
  <section class="page-head">
    <div class="wrap">
      <h1 class="shaded"><span class="fill" data-text="Board">Board</span></h1>
      <p>The twelve committees behind AKD 30.0. Hover or tap a print to see it in color.</p>
    </div>
  </section>
  <div class="wrap">
    <div class="album" id="album"></div>
    <p class="note">Prints from last season's board. Names and this year's photos go here.</p>
  </div>
</main>

<footer class="footer"></footer>

<script src="../assets/data.js"></script>
<script src="site.js"></script>
<script>
  const tilts = [-3, 2, -1.5, 3.5, -2.5, 1.5, -3.5, 2.5, -2, 3, -1, 2];
  document.querySelector("#album").innerHTML = window.AKD.crew.map((c, i) => `
    <figure class="print" tabindex="0" style="--tilt:${tilts[i % tilts.length]}deg">
      <i></i><i></i><i></i><i></i>
      <div class="ph"><img src="../assets/board/${c.img}" alt="${c.committee} committee" loading="lazy"></div>
      <figcaption>${c.committee}</figcaption>
    </figure>`).join("");
</script>
</body>
</html>
